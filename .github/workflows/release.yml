# Builds the mod and publishes a GitHub release tagged v<mod_version> (from gradle.properties).
# Run it from the Actions tab ("Run workflow"), or push a v* tag.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Attach only the mod jar, not the -sources jar.
        run: |
          TAG="v$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          gh release create "$TAG" --target "$GITHUB_SHA" \
            --title "Archangel Client $TAG" \
            --notes-file .github/release-notes.md \
            $(ls build/libs/*.jar | grep -v -- '-sources.jar$')
