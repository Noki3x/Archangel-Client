# Builds the mod and publishes a GitHub release when a version tag (v*) is pushed.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        # Attach only the mod jar, not the -sources jar.
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Archangel Client $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md \
            $(ls build/libs/*.jar | grep -v -- '-sources.jar$')
